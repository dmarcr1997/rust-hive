[package]
name = "hive-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
hive-protocol = { path = "../hive-protocol" }

tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
sysinfo = "0.39.6"
hostname = "0.4"
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"